name: Submit electricity reading

on:
  workflow_dispatch:
    inputs:
      value:
        description: New meter reading value
        required: true
        type: string

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Submit reading
        run: node --experimental-strip-types src/electricity.ts ${{ inputs.value }}
        env:
          NODE_ENV: production
          ELECTRICITY_BASE_URL: ${{ secrets.ELECTRICITY_BASE_URL }}
          ELECTRICITY_ACCOUNT_NUMBER: ${{ secrets.ELECTRICITY_ACCOUNT_NUMBER }}
